[project]
name = "claude-chroma"
version = "0.1.1"
description = "Ingest Claude AI conversation exports into a local ChromaDB vector database for semantic search"
readme = "README.md"
authors = [
    { name = "Dan Wahl", email = "hi@danwahl.net" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb",
    "typer[all]",
    "rich",
]

[project.scripts]
claude-chroma = "claude_chroma.cli:app"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-tmp-files",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
